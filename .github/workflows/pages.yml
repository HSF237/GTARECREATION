# Builds the game (bakes the character meshes, bundles one HTML page) and publishes it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache baked character meshes
        uses: actions/cache@v4
        with:
          path: .cache/humans
          key: humans-${{ hashFiles('src/entities/humanMesh.js', 'src/entities/humanCodec.js', 'src/entities/humanCatalog.js', 'src/entities/character.js', 'tools/humanDecimate.mjs') }}
          restore-keys: humans-
      - name: Bake character meshes
        run: node tools/bake-humans.mjs
      - name: Build the game
        run: node build.mjs
      - name: Prepare site
        run: mkdir -p site && cp dist/solharbor.html site/index.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
